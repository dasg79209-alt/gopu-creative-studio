  <script>
    pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';

    const canvas = document.getElementById('canvasViewport');
    const baseDocWrapper = document.getElementById('baseDocWrapper');
    const baseImg = document.getElementById('baseImg');
    const emptyNotice = document.getElementById('emptyNotice');
    const zoomWrapper = document.getElementById('zoomWrapper');
    const mainWorkspace = document.getElementById('mainWorkspace');
    
    let activeBox = null;
    let docRotation = 0;
    let currentZoom = 1.0;
    let isGrayscale = false;

    /* ========================================================
       1. INDEXED-DB PERSISTENT DATABASE (UNLIMITED STORAGE)
       ======================================================== */
    const DB_NAME = 'GopuMasterDB';
    const DB_VERSION = 1;
    const STORE_NAME = 'studioStore';

    function openDatabase() {
      return new Promise((resolve, reject) => {
        const req = indexedDB.open(DB_NAME, DB_VERSION);
        req.onupgradeneeded = (e) => {
          const db = e.target.result;
          if (!db.objectStoreNames.contains(STORE_NAME)) db.createObjectStore(STORE_NAME);
        };
        req.onsuccess = () => resolve(req.result);
        req.onerror = () => reject(req.error);
      });
    }

    async function dbSave(key, value) {
      try {
        const db = await openDatabase();
        const tx = db.transaction(STORE_NAME, 'readwrite');
        tx.objectStore(STORE_NAME).put(value, key);
      } catch (err) {
        console.error("DB Save Failed", err);
      }
    }

    async function dbGet(key) {
      try {
        const db = await openDatabase();
        return new Promise((resolve) => {
          const tx = db.transaction(STORE_NAME, 'readonly');
          const req = tx.objectStore(STORE_NAME).get(key);
          req.onsuccess = () => resolve(req.result);
          req.onerror = () => resolve(null);
        });
      } catch (err) {
        return null;
      }
    }

    /* ========================================================
       2. MOUSE WHEEL ZOOM & KEYBOARD SHORTCUTS
       ======================================================== */
    mainWorkspace.addEventListener('wheel', (e) => {
      if (e.ctrlKey || e.target.closest('#zoomWrapper')) {
        e.preventDefault();
        const zoomDelta = e.deltaY < 0 ? 0.08 : -0.08;
        zoomCanvas(zoomDelta);
      }
    }, { passive: false });

    window.addEventListener('keydown', (e) => {
      const isInput = e.target.tagName === 'INPUT' || e.target.isContentEditable;

      if (e.ctrlKey && (e.key === '=' || e.key === '+')) {
        e.preventDefault(); zoomCanvas(0.1);
      } else if (e.ctrlKey && e.key === '-') {
        e.preventDefault(); zoomCanvas(-0.1);
      } else if (e.ctrlKey && e.key === '0') {
        e.preventDefault(); resetZoom();
      }

      if (!isInput) {
        if (e.key === '[') rotateDocument(-90);
        if (e.key === ']') rotateDocument(90);
      }

      if ((e.key === 'Delete' || e.key === 'Backspace') && activeBox && !isInput) {
        activeBox.remove();
        activeBox = null;
        triggerSync();
      }

      if (activeBox && !isInput && ['ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight'].includes(e.key)) {
        e.preventDefault();
        const step = e.shiftKey ? 10 : 1;
        let left = parseInt(activeBox.style.left) || 0;
        let top = parseInt(activeBox.style.top) || 0;

        if (e.key === 'ArrowUp') top -= step;
        if (e.key === 'ArrowDown') top += step;
        if (e.key === 'ArrowLeft') left -= step;
        if (e.key === 'ArrowRight') left += step;

        activeBox.style.left = left + 'px';
        activeBox.style.top = top + 'px';
        triggerSync();
      }
    });

    /* ========================================================
       3. DOCUMENT LOADING (PDF & HIGH-RES IMAGES)
       ======================================================== */
    async function loadDocument(e) {
      const file = e.target.files[0];
      if (!file) return;

      const ext = file.name.split('.').pop().toLowerCase();
      if (ext === 'pdf') {
        const buf = await file.arrayBuffer();
        const doc = await pdfjsLib.getDocument({ data: buf }).promise;
        const page = await doc.getPage(1);
        const viewport = page.getViewport({ scale: 2.0 });

        const c = document.createElement('canvas');
        c.width = viewport.width;
        c.height = viewport.height;
        await page.render({ canvasContext: c.getContext('2d'), viewport }).promise;
        baseImg.src = c.toDataURL('image/png');
      } else {
        const reader = new FileReader();
        reader.onload = (evt) => { baseImg.src = evt.target.result; };
        reader.readAsDataURL(file);
      }

      baseImg.onload = () => {
        emptyNotice.style.display = 'none';
        baseImg.classList.remove('hidden');
        docRotation = 0;
        updateDocRotation();
        triggerSync();
      };
    }

    function rotateDocument(deg) {
      docRotation = (docRotation + deg) % 360;
      updateDocRotation();
      triggerSync();
    }

    function updateDocRotation() {
      baseDocWrapper.style.transform = `rotate(${docRotation}deg)`;
    }

    function zoomCanvas(delta) {
      currentZoom = Math.min(Math.max(0.3, currentZoom + delta), 3.0);
      zoomWrapper.style.transform = `scale(${currentZoom})`;
    }

    function resetZoom() {
      currentZoom = 1.0;
      zoomWrapper.style.transform = 'scale(1)';
    }

    /* ========================================================
       4. ELEMENT GENERATORS & INTERACTION ENGINE
       ======================================================== */
    function addTextBox(txt = "Text Here", x = 50, y = 50) {
      const box = document.createElement('div');
      box.className = 'draggable-box active';
      box.dataset.rotation = "0";
      box.dataset.scale = "1";
      box.dataset.flipx = "1";
      box.dataset.flipy = "1";
      box.style.left = x + 'px';
      box.style.top = y + 'px';
      box.style.backgroundColor = '#ffffff';
      box.style.color = '#000000';
      box.style.fontSize = '14px';
      box.style.fontFamily = "'Inter', sans-serif";
      box.style.padding = '2px 4px';
      box.style.lineHeight = '1.2';
      box.style.minWidth = '30px';
      box.style.zIndex = '10';

      box.innerHTML = `
        <div class="controls-tag">
          <i class="fa-solid fa-arrows-up-down-left-right text-[9px]"></i>
          <span>Text</span>
          <i class="fa-solid fa-xmark ml-1 cursor-pointer hover:text-rose-300" onclick="this.closest('.draggable-box').remove(); triggerSync();"></i>
        </div>
        <div contenteditable="true" spellcheck="false">${txt}</div>
      `;

      initPointerDrag(box);
      canvas.appendChild(box);
      selectElement(box);
      triggerSync();
    }

    function addPhotoBox(e) {
      const file = e.target.files[0];
      if (!file) return;

      const reader = new FileReader();
      reader.onload = (evt) => {
        const box = document.createElement('div');
        box.className = 'draggable-box active';
        box.dataset.rotation = "0";
        box.dataset.scale = "1";
        box.dataset.flipx = "1";
        box.dataset.flipy = "1";
        box.style.left = '60px';
        box.style.top = '60px';
        box.style.width = '110px';
        box.style.height = '130px';
        box.style.resize = 'both';
        box.style.overflow = 'hidden';
        box.style.zIndex = '10';

        box.innerHTML = `
          <div class="controls-tag">
            <i class="fa-solid fa-image text-[9px]"></i>
            <span>Photo</span>
            <i class="fa-solid fa-xmark ml-1 cursor-pointer hover:text-rose-300" onclick="this.closest('.draggable-box').remove(); triggerSync();"></i>
          </div>
          <img src="${evt.target.result}" class="w-full h-full object-cover pointer-events-none" />
        `;

        initPointerDrag(box);
        canvas.appendChild(box);
        selectElement(box);
        triggerSync();
      };
      reader.readAsDataURL(file);
    }

    function initPointerDrag(el) {
      let isDragging = false;
      let startX, startY, origX, origY;

      const onStart = (clientX, clientY, target) => {
        if (target.isContentEditable) return;
        selectElement(el);
        isDragging = true;
        startX = clientX;
        startY = clientY;
        origX = parseInt(el.style.left, 10) || 0;
        origY = parseInt(el.style.top, 10) || 0;
      };

      const onMove = (clientX, clientY) => {
        if (!isDragging) return;
        el.style.left = (origX + (clientX - startX) / currentZoom) + 'px';
        el.style.top = (origY + (clientY - startY) / currentZoom) + 'px';
      };

      const onEnd = () => {
        if (isDragging) {
          isDragging = false;
          triggerSync();
        }
      };

      el.addEventListener('mousedown', (e) => {
        onStart(e.clientX, e.clientY, e.target);
        const mm = (m) => onMove(m.clientX, m.clientY);
        const mu = () => {
          onEnd();
          window.removeEventListener('mousemove', mm);
          window.removeEventListener('mouseup', mu);
        };
        window.addEventListener('mousemove', mm);
        window.addEventListener('mouseup', mu);
      });

      el.addEventListener('touchstart', (e) => {
        const touch = e.touches[0];
        onStart(touch.clientX, touch.clientY, e.target);
      }, { passive: true });

      el.addEventListener('touchmove', (e) => {
        const touch = e.touches[0];
        onMove(touch.clientX, touch.clientY);
      }, { passive: true });

      el.addEventListener('touchend', onEnd);

      const textNode = el.querySelector('[contenteditable="true"]');
      if (textNode) textNode.addEventListener('input', triggerSync);
    }

    function selectElement(el) {
      if (activeBox) activeBox.classList.remove('active');
      activeBox = el;
      if (el) {
        el.classList.add('active');
        document.getElementById('fontSize').value = parseInt(el.style.fontSize) || 14;
        document.getElementById('fontColor').value = toHex(el.style.color || '#000000');
        document.getElementById('boxBgColor').value = toHex(el.style.backgroundColor || '#ffffff');
        document.getElementById('elemRotation').value = el.dataset.rotation || 0;
        document.getElementById('elemScale').value = el.dataset.scale || 1.0;
        document.getElementById('letterSpacing').value = parseFloat(el.style.letterSpacing) || 0;
        document.getElementById('lineHeight').value = parseFloat(el.style.lineHeight) || 1.2;
        document.getElementById('cornerRadius').value = parseInt(el.style.borderRadius) || 0;
        document.getElementById('boxOpacity').value = (parseFloat(el.style.opacity) || 1) * 100;
        if (el.style.fontFamily) document.getElementById('fontSelect').value = el.style.fontFamily;
      }
    }

    /* ========================================================
       5. ALL STYLING & PHOTOSHOP ADJUSTMENT METHODS
       ======================================================== */
    function applyBoxStyle(prop, val) {
      if (!activeBox) return;
      activeBox.style[prop] = val;
      triggerSync();
    }

    function updateActiveTransform() {
      if (!activeBox) return;
      const r = document.getElementById('elemRotation').value;
      const s = document.getElementById('elemScale').value;
      const fx = activeBox.dataset.flipx || 1;
      const fy = activeBox.dataset.flipy || 1;
      activeBox.dataset.rotation = r;
      activeBox.dataset.scale = s;
      activeBox.style.transform = `rotate(${r}deg) scale(${s * fx}, ${s * fy})`;
      triggerSync();
    }

    function toggleFlip(axis) {
      if (!activeBox) return;
      if (axis === 'X') activeBox.dataset.flipx = (activeBox.dataset.flipx == -1) ? 1 : -1;
      if (axis === 'Y') activeBox.dataset.flipy = (activeBox.dataset.flipy == -1) ? 1 : -1;
      updateActiveTransform();
    }

    function toggleBold() {
      if (!activeBox) return;
      activeBox.style.fontWeight = activeBox.style.fontWeight === 'bold' ? 'normal' : 'bold';
      triggerSync();
    }

    function toggleItalic() {
      if (!activeBox) return;
      activeBox.style.fontStyle = activeBox.style.fontStyle === 'italic' ? 'normal' : 'italic';
      triggerSync();
    }

    function toggleUnderline() {
      if (!activeBox) return;
      activeBox.style.textDecoration = activeBox.style.textDecoration.includes('underline') ? 'none' : 'underline';
      triggerSync();
    }

    function toggleStrike() {
      if (!activeBox) return;
      activeBox.style.textDecoration = activeBox.style.textDecoration.includes('line-through') ? 'none' : 'line-through';
      triggerSync();
    }

    function toggleCase() {
      if (!activeBox) return;
      activeBox.style.textTransform = activeBox.style.textTransform === 'uppercase' ? 'none' : 'uppercase';
      triggerSync();
    }

    function toggleShadow() {
      if (!activeBox) return;
      activeBox.style.textShadow = activeBox.style.textShadow ? '' : '1px 1px 3px rgba(0,0,0,0.5)';
      triggerSync();
    }

    function applyFilters() {
      if (!activeBox) return;
      const b = document.getElementById('imgBrightness').value;
      const c = document.getElementById('imgContrast').value;
      const g = isGrayscale ? 100 : 0;
      const img = activeBox.querySelector('img');
      if (img) img.style.filter = `brightness(${b}%) contrast(${c}%) grayscale(${g}%)`;
      triggerSync();
    }

    function toggleGrayscale() {
      isGrayscale = !isGrayscale;
      applyFilters();
    }

    function applyRadius(val) {
      if (!activeBox) return;
      activeBox.style.borderRadius = val + 'px';
      triggerSync();
    }

    function changeLayer(step) {
      if (!activeBox) return;
      let currentZ = parseInt(activeBox.style.zIndex) || 10;
      activeBox.style.zIndex = Math.max(1, currentZ + step);
      triggerSync();
    }

    async function pickPipetteColor() {
      if (!window.EyeDropper) return;
      try {
        const res = await (new EyeDropper()).open();
        document.getElementById('boxBgColor').value = res.sRGBHex;
        applyBoxStyle('backgroundColor', res.sRGBHex);
      } catch (e) {}
    }

    function duplicateActiveBox() {
      if (!activeBox) return;
      const clone = activeBox.cloneNode(true);
      clone.style.left = (parseInt(activeBox.style.left) + 20) + 'px';
      clone.style.top = (parseInt(activeBox.style.top) + 20) + 'px';
      initPointerDrag(clone);
      canvas.appendChild(clone);
      selectElement(clone);
      triggerSync();
    }

    canvas.addEventListener('click', (e) => {
      if (e.target === canvas || e.target === baseImg || e.target === baseDocWrapper) selectElement(null);
    });

    /* ========================================================
       6. DATABASE SYNC (AUTO-SAVE)
       ======================================================== */
    let saveDebounce;
    function triggerSync() {
      const status = document.getElementById('saveStatus');
      status.innerHTML = `<i class="fa-solid fa-arrows-rotate fa-spin text-[10px]"></i><span>Syncing...</span>`;
      status.className = "text-[10px] sm:text-xs font-medium px-2.5 py-1 rounded-full bg-amber-950/60 text-amber-400 border border-amber-500/30 flex items-center gap-1.5";

      clearTimeout(saveDebounce);
      saveDebounce = setTimeout(async () => {
        await dbSave('canvas_html', canvas.innerHTML);
        await dbSave('base_img', baseImg.src);
        await dbSave('doc_rot', docRotation);

        status.innerHTML = `<i class="fa-solid fa-database text-[10px]"></i><span class="hidden sm:inline">Database Synced</span><span class="sm:hidden">Saved</span>`;
        status.className = "text-[10px] sm:text-xs font-medium px-2.5 py-1 rounded-full bg-emerald-950/60 text-emerald-400 border border-emerald-500/30 flex items-center gap-1.5";
      }, 300);
    }

    window.addEventListener('DOMContentLoaded', async () => {
      const savedDoc = await dbGet('base_img');
      const savedHTML = await dbGet('canvas_html');
      docRotation = (await dbGet('doc_rot')) || 0;

      if (savedDoc && savedHTML) {
        canvas.innerHTML = savedHTML;
        const restoredBase = document.getElementById('baseImg');
        restoredBase.src = savedDoc;
        restoredBase.classList.remove('hidden');
        document.getElementById('emptyNotice').style.display = 'none';
        updateDocRotation();
        canvas.querySelectorAll('.draggable-box').forEach(initPointerDrag);
      }
    });

    async function resetWorkspace() {
      if (confirm("Reset everything to empty canvas?")) {
        const db = await openDatabase();
        const tx = db.transaction(STORE_NAME, 'readwrite');
        tx.objectStore(STORE_NAME).clear();
        location.reload();
      }
    }

    /* ========================================================
       7. BULLETPROOF 100% CLEAN PDF & JPG EXPORT (NO WHITE BOXES)
       ======================================================== */
    function exportCleanDoc(format) {
      selectElement(null);
      document.body.classList.add('exporting');

      const originalZoom = currentZoom;
      zoomWrapper.style.transform = 'scale(1)';

      setTimeout(() => {
        html2canvas(canvas, {
          scale: 2.5,
          useCORS: true,
          allowTaint: true,
          backgroundColor: '#ffffff'
        }).then((renderedCanvas) => {
          document.body.classList.remove('exporting');
          zoomWrapper.style.transform = `scale(${originalZoom})`;

          if (format === 'jpg') {
            const link = document.createElement('a');
            link.download = 'GopuStudio_Edited.jpg';
            link.href = renderedCanvas.toDataURL('image/jpeg', 0.98);
            link.click();
          } 
          else if (format === 'pdf') {
            const { jsPDF } = window.jspdf;
            const imgData = renderedCanvas.toDataURL('image/jpeg', 0.98);
            const w = renderedCanvas.width;
            const h = renderedCanvas.height;
            const orientation = w > h ? 'l' : 'p';

            const pdf = new jsPDF({
              orientation: orientation,
              unit: 'px',
              format: [w, h]
            });

            pdf.addImage(imgData, 'JPEG', 0, 0, w, h);
            pdf.save('GopuStudio_Edited.pdf');
          }
        }).catch((err) => {
          alert('Export Error: ' + err.message);
          document.body.classList.remove('exporting');
          zoomWrapper.style.transform = `scale(${originalZoom})`;
        });
      }, 80);
    }

    function toHex(rgb) {
      if (!rgb || rgb.startsWith('#')) return rgb || '#ffffff';
      const res = rgb.match(/\d+/g);
      if (!res || res.length < 3) return '#ffffff';
      return "#" + ((1 << 24) + (parseInt(res[0]) << 16) + (parseInt(res[1]) << 8) + parseInt(res[2])).toString(16).slice(1);
    }
  </script>
